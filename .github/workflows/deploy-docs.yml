name: Deploy Docs to GCP

on:
  push:
    branches:
      - doc-deploy

permissions:
  packages: write
  contents: read

env:
  IMAGE_NAME: ghcr.io/hairscope/hairscope-docs:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docs
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to GCP server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            # Login to GitHub Container Registry using PAT
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u hairscope --password-stdin

            # Pull the latest image
            docker pull ghcr.io/hairscope/hairscope-docs:latest

            # Stop and remove existing container if running
            docker stop hairscope-docs 2>/dev/null || true
            docker rm hairscope-docs 2>/dev/null || true

            # Run new container on port 3001
            docker run -d \
              --name hairscope-docs \
              --restart unless-stopped \
              -p 3001:3000 \
              ghcr.io/hairscope/hairscope-docs:latest

            # Clean up old images
            docker image prune -f
